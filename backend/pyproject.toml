[project]
name = "backend"
version = "0.1.0"
description = "Persistent FastAPI service for the AgentOS desktop simulation"
readme = "README.md"
authors = [
    { name = "vardhin", email = "gamidisurya.vardhin2022@vitstudent.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
